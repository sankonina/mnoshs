<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        h1, h2 {
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        .expense {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .delete {
            width: auto;
            padding: 8px 15px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Expense Tracker</h1>

    <div class="dashboard">
        <div class="card">
            <h3>Total</h3>
            <p id="total">0.00</p>
        </div>

        <div class="card">
            <h3>Expenses</h3>
            <p id="count">0</p>
        </div>

        <div class="card">
            <h3>Average</h3>
            <p id="average">0.00</p>
        </div>
    </div>

    <form id="expenseForm">

        <input
            id="name"
            type="text"
            placeholder="Expense name"
            required
        >

        <input
            id="amount"
            type="number"
            step="0.01"
            min="0"
            placeholder="Amount"
            required
        >

        <input
            id="category"
            type="text"
            placeholder="Category"
            required
        >

        <button type="submit">
            Add Expense
        </button>

    </form>

    <h2>My Expenses</h2>
    <h3 id="total">Total: 0.00</h3>

    <div id="expenses"></div>

    <script>
        const form = document.getElementById("expenseForm");
        const expensesContainer = document.getElementById("expenses");

        async function loadExpenses() {
            try {
                const response = await fetch("/expenses");

                if (!response.ok) {
                    throw new Error("Failed to load expenses");
                }

                const expenses = await response.json();

                expensesContainer.innerHTML = "";

                let total = 0;

                expenses.forEach(expense => {
                    total += expense.amount;

                    const div = document.createElement("div");

                    div.className = "expense";

                    div.innerHTML = `
                        <strong>${escapeHtml(expense.name)}</strong><br>
                        Amount: ${expense.amount.toFixed(2)}<br>
                        Category: ${escapeHtml(expense.category)}
                        <br><br>

                        <button
                            class="delete"
                            onclick="deleteExpense(${expense.id})">
                            Delete
                        </button>
                    `;

                    expensesContainer.appendChild(div);
                });

                const count = expenses.length;
                const average = count > 0 ? total / count : 0;

                document.getElementById("total").textContent =
                    total.toFixed(2);

                document.getElementById("count").textContent =
                    count;

                document.getElementById("average").textContent =
                    average.toFixed(2);

            } catch (error) {
                console.error(error);
                expensesContainer.innerHTML =
                    "<p>Could not load expenses.</p>";
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const expense = {
                name: document.getElementById("name").value.trim(),

                amount: parseFloat(
                    document.getElementById("amount").value
                ),

                category: document
                    .getElementById("category")
                    .value
                    .trim()
            };

            const response = await fetch("/expenses", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(expense)
            });

            if (!response.ok) {
                alert("Could not add expense.");
                return;
            }

            form.reset();

            await loadExpenses();
        });

        async function deleteExpense(id) {
            const response = await fetch(`/expenses/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                alert("Could not delete expense.");
                return;
            }

            await loadExpenses();
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }

        loadExpenses();
        function updateTotal(expenses) {
    const total = expenses.reduce(
        (sum, expense) => sum + expense.amount,
        0
        const expenses = await response.json();
        updateTotal(expenses);
    );

    document.getElementById("total").textContent =
        `Total: ${total.toFixed(2)}`;
}
    </script>

</body>
</html>
